name: PR 26 Linux ARM64 Bend verification
on:
  push:
    branches:
      - codex/linux-bend-pr26
    paths:
      - .github/workflows/verify-pr26-linux-bend.yml

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Current dev baseline
            sha: 86978c2818ae278344bfabb5da17beba80b8652e
            tree: 0e7e1a5c17a120b5962d2bcf399699a7a467a340
          - label: PR 26 integrated
            sha: 03e82d86b73722133e1066b85aaa13bc62716b70
            tree: 76f6623538a0400e70e6739d79500b8e2264fb98
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Check runner and reserve disk space
        shell: bash
        run: |
          test "$(uname -s)-$(uname -m)" = Linux-aarch64
          df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { exit ($4 < 16777216) }'
          . /etc/os-release
          printf 'OS=%s %s ARCH=%s\n' "$ID" "$VERSION_ID" "$(uname -m)"

      - name: Check out the source under test
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: edgepillar/orchestrator
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify the source pin
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          printf 'SOURCE_COMMIT=%s SOURCE_TREE=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.12"
          cache: false

      - name: Install pinned Bend
        shell: bash
        run: |
          test "$(go version)" = 'go version go1.22.12 linux/arm64'
          go version
          install_dir="$(mktemp -d "$RUNNER_TEMP/bend.XXXXXXXX")"
          archive="$install_dir/bend.tar.gz"
          release_url=https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-linux-arm64.tar.gz
          release_sha=2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 35949294 \
            --retry 2 --output "$archive" "$release_url"
          test "$(stat -c %s "$archive")" = 35949294
          echo "$release_sha  $archive" | sha256sum --check
          python3 - "$archive" <<'PY'
          from pathlib import PurePosixPath
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as tar:
              total_size = 0
              paths = set()
              for entry in tar:
                  name = PurePosixPath(entry.name)
                  assert name.parts and name.parts[0] == "bend"
                  assert ".." not in name.parts and name not in paths
                  assert entry.isfile() or entry.isdir()
                  paths.add(name)
                  total_size += entry.size
                  assert len(paths) <= 10000 and total_size <= 256 * 1024 * 1024
              assert PurePosixPath("bend/bin/bend") in paths
          PY
          tar -xzf "$archive" -C "$install_dir" --no-same-owner --no-same-permissions
          test -x "$install_dir/bend/bin/bend"
          printf 'BEND_RELEASE=v2.0.40 BEND_SHA256=%s\n' "$release_sha"
          echo "BEND_HOME=$install_dir/bend" >> "$GITHUB_ENV"
          echo "$install_dir/bend/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean for BendTT
        shell: bash
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")"
          archive="$install_dir/lean.tar.zst"
          release_url=https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux_aarch64.tar.zst
          release_sha=40b04fdb7fb849d3c80e10c3bbeebc7b7354b6d3f07450b9168c2149b40d2a82
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 180 --max-filesize 581973544 \
            --retry 2 --output "$archive" "$release_url"
          test "$(stat -c %s "$archive")" = 581973544
          echo "$release_sha  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$install_dir" --strip-components=1 \
            --no-same-owner --no-same-permissions
          rm -- "$archive"
          version="$("$install_dir/bin/lean" --version)"
          grep -E 'version 4\.34\.0([ ,]|$)' <<< "$version"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Check the Bend model proofs
        id: proofs
        shell: bash
        run: |
          bend PROOF.bend --verdict | tee "$RUNNER_TEMP/bend-proof.log"
          grep -Fq 'ALL PROOFS CHECK' "$RUNNER_TEMP/bend-proof.log"

      - name: Check build and vet
        shell: bash
        run: |
          go build -buildvcs=false -ldflags '-extldflags=-Wl,--allow-multiple-definition' ./...
          go vet ./...
          go vet -tags=bend ./...

      - name: Compare the matching tests and run the full Bend suite
        if: ${{ !cancelled() && steps.proofs.outcome == 'success' }}
        shell: bash
        run: |
          report_go() {
            local phase="$1"
            shift
            local events="$RUNNER_TEMP/orchestrator-$phase.jsonl"
            local rc=0
            go test -json -race -p 2 -count=1 -timeout=20m -tags=bend -buildvcs=false \
              -ldflags '-extldflags=-Wl,--allow-multiple-definition' "$@" > "$events" || rc=$?
            jq -c --arg phase "$phase" '
              if .Action == "pass" or .Action == "fail" or .Action == "skip" then
                {phase: $phase, result: .Action, package: .Package, test: .Test, elapsed: .Elapsed}
              elif .Action == "output" and ((.Output // "") | test("[0-9]+ Go outcomes checked by Bend")) then
                {phase: $phase, result: "bend", package: .Package, test: .Test, comparisons: (.Output | capture("(?<count>[0-9]+) Go outcomes").count | tonumber)}
              elif .Action == "output" and ((.Output // "") | contains("Bend comparison failed")) then
                {phase: $phase, result: "bend_error", package: .Package, test: .Test}
              elif .Action == "output" and ((.Output // "") | contains("WARNING: DATA RACE")) then
                {phase: $phase, result: "race", package: .Package, test: .Test}
              else empty end
            ' "$events" || return "$?"
            printf 'GO_TEST_EXIT %s %s\n' "$phase" "$rc"
            return "$rc"
          }
          matched_rc=0
          full_rc=0
          report_go matched -run '^(FuzzQueryRangeGrowth|TestConfiguredOneBlockCeiling|TestFinalizedUnsignedWraps|TestPruneAgreesWithBend|TestQueuedEventAgreesWithBend|TestReconcileAgreesWithBend|TestReconcileBridgeAdvancesDuringReads|TestReconcileBridgeViewAgreesWithBend|TestReconcileLookupFailureRecovery|TestReconcileRPCReplies|TestReconcileRejectsInvalidBridgeFrontier|TestReconcileStatusPreservesListenerUpdate|TestReconcileStoppingPoints|TestRejectionAtFloorRestartsGrowthStreak|TestSameCeremonyDifferentStableBridgeTips|TestSigningThresholdAgreesWithBend|TestSigningWindowAfterRPCAdvance|TestSyncAcceptsLogsAtBothInclusiveBounds|TestSyncKeepsCursorOnOutOfRangeLog|TestSyncWindowAgreesWithBend|TestUnwrapSigningDefersStoredRowWithoutEvmEvidence|TestWrapFinalityAgreesWithBend)$' ./db/unwrap ./network ./node ./tss || matched_rc=$?
          report_go full ./... || full_rc=$?
          test "$matched_rc" = 0 && test "$full_rc" = 0
