name: Qualify redeem recovery regressions
on:
  push:
    branches:
      - codex/linux-pr26-redeem-write-durability
    paths:
      - .github/workflows/qualify-redeem-write-durability.yml

permissions:
  contents: read

jobs:
  durability:
    name: Linux ARM64 redeem recovery regressions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 16
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Check out the exact recovery candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 6fd0da12ff4bc8f1ba4dc2c4021de27915ed2571
          persist-credentials: false
          fetch-depth: 6

      - name: Verify the source pin
        shell: bash
        run: |
          test "$(uname -s)-$(uname -m)" = Linux-aarch64
          test "$(git rev-parse HEAD)" = 6fd0da12ff4bc8f1ba4dc2c4021de27915ed2571
          test "$(git rev-parse HEAD^{tree})" = 77b0789308133252142acbe51e54be9f8cf27b43
          git merge-base --is-ancestor b01ff11808b302cb9630f61921d615e54be9f7a6 HEAD
          git log -1 --format='SOURCE_COMMIT=%H SOURCE_TREE=%T'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.12"
          cache: false

      - name: Check Go formatting
        shell: bash
        run: |
          gofmt -d db/interfaces.go db/wrap/redeem_incident_test.go db/wrap/redeem_status.go db/wrap/redeem_status_test.go db/wrap/store.go network/registered_redeem.go network/registered_redeem_test.go rpc/redeem_settlement.go
          test -z "$(gofmt -l db/interfaces.go db/wrap/redeem_incident_test.go db/wrap/redeem_status.go db/wrap/redeem_status_test.go db/wrap/store.go network/registered_redeem.go network/registered_redeem_test.go rpc/redeem_settlement.go)"

      - name: Run the storage regression tests
        shell: bash
        run: |
          test "$(go version)" = 'go version go1.22.12 linux/arm64'
          go version
          go test -race -p 2 -count=1 -timeout=4m -v \
            -ldflags '-extldflags=-Wl,--allow-multiple-definition' \
            -run 'Test(Redeem|CatchupRedeem|CanonicalReplay|WrapRows|ExplicitRewind|Registration|HaltSignatures|HistoricalRedeem|Settled|SourceReply|ConfirmingReply)' ./db/wrap ./db/manager ./db/unwrap ./network ./rpc \
            | sed -e "s|$RUNNER_TEMP|<runner-temp>|g" -e "s|$GITHUB_WORKSPACE|<source>|g"

      - name: Confirm the tests catch the original recovery failures
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/journal-control.XXXXXXXX")"
          git show b01ff11808b302cb9630f61921d615e54be9f7a6:db/wrap/store.go > "$fixture/store.go"
          git show b01ff11808b302cb9630f61921d615e54be9f7a6:network/registered_redeem.go > "$fixture/registered_redeem.go"
          python3 - "$fixture" <<'PY'
          import json
          from pathlib import Path
          import sys

          fixture = Path(sys.argv[1])
          (fixture / "overlay.json").write_text(json.dumps({
              "Replace": {
                  str(Path("db/wrap/store.go").resolve()): str(fixture / "store.go"),
                  str(Path("network/registered_redeem.go").resolve()): str(fixture / "registered_redeem.go"),
              },
          }))
          PY
          rc=0
          go test -race -count=1 -timeout=3m -json -vet=off \
            -ldflags '-extldflags=-Wl,--allow-multiple-definition' \
            -overlay "$fixture/overlay.json" \
            -run '^Test(RedeemWritesRetryAfterJournalSyncFailure|CanonicalReplayReconcilesLegacyTerminalRedeem)$' ./db/wrap ./network \
            > "$fixture/results.jsonl" || rc=$?
          test "$rc" = 1
          python3 - "$fixture/results.jsonl" <<'PY'
          import json
          import sys

          expected = {
              "TestRedeemWritesRetryAfterJournalSyncFailure/wrap_row",
              "TestRedeemWritesRetryAfterJournalSyncFailure/redeem_status",
              "TestCanonicalReplayReconcilesLegacyTerminalRedeem/open_at_final_height",
              "TestCanonicalReplayReconcilesLegacyTerminalRedeem/final_state_unavailable",
          }
          with open(sys.argv[1], encoding="utf-8") as stream:
              rows = [json.loads(line) for line in stream]
          failed = {row.get("Test") for row in rows if row["Action"] == "fail"}
          observed = {row.get("Test") for row in rows if any(marker in row.get("Output", "") for marker in ("failed sync left data visible", "replayed wrap =", "replay error"))}
          assert expected <= failed and expected <= observed
          for name in sorted(expected):
              print("CONTROL_REPRODUCED", name)
          PY
