name: Linux and Bend verification
on:
  push:
    branches:
      - codex/linux-bend-pr17-pr18
    paths:
      - .github/workflows/verify-linux-bend.yml

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Current dev baseline
            sha: 86978c2818ae278344bfabb5da17beba80b8652e
            tree: 0e7e1a5c17a120b5962d2bcf399699a7a467a340
          - label: PR 17 status fix
            sha: 73c9f0d096702e98ac0cca123712fe312d1cba99
            tree: dd5528da10949da22bec6a28c1997f56cf8bcde8
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Check runner and reserve disk space
        shell: bash
        run: |
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { exit ($4 < 16777216) }'
          . /etc/os-release
          printf 'OS=%s %s ARCH=%s\n' "$ID" "$VERSION_ID" "$(uname -m)"

      - name: Check out the source under test
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: edgepillar/orchestrator
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify the source pin
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.sha }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          printf 'SOURCE_COMMIT=%s SOURCE_TREE=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.12"
          cache: false

      - name: Install pinned Bend
        shell: bash
        run: |
          test "$(go version)" = 'go version go1.22.12 linux/amd64'
          go version
          install_dir="$(mktemp -d "$RUNNER_TEMP/bend.XXXXXXXX")"
          archive="$install_dir/bend.tar.gz"
          release_url=https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-linux-x64.tar.gz
          release_sha=c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 36219422 \
            --retry 2 --output "$archive" "$release_url"
          test "$(stat -c %s "$archive")" = 36219422
          echo "$release_sha  $archive" | sha256sum --check
          python3 - "$archive" <<'PY'
          from pathlib import PurePosixPath
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as tar:
              total_size = 0
              paths = set()
              for entry in tar:
                  name = PurePosixPath(entry.name)
                  assert name.parts and name.parts[0] == "bend"
                  assert ".." not in name.parts and name not in paths
                  assert entry.isfile() or entry.isdir()
                  paths.add(name)
                  total_size += entry.size
                  assert len(paths) <= 10000 and total_size <= 256 * 1024 * 1024
              assert PurePosixPath("bend/bin/bend") in paths
          PY
          tar -xzf "$archive" -C "$install_dir" --no-same-owner --no-same-permissions
          test -x "$install_dir/bend/bin/bend"
          printf 'BEND_RELEASE=v2.0.40 BEND_SHA256=%s\n' "$release_sha"
          echo "BEND_HOME=$install_dir/bend" >> "$GITHUB_ENV"
          echo "$install_dir/bend/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean for BendTT
        shell: bash
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")"
          archive="$install_dir/lean.tar.zst"
          release_url=https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst
          release_sha=caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 180 --max-filesize 580367391 \
            --retry 2 --output "$archive" "$release_url"
          test "$(stat -c %s "$archive")" = 580367391
          echo "$release_sha  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$install_dir" --strip-components=1 \
            --no-same-owner --no-same-permissions
          rm -- "$archive"
          version="$("$install_dir/bin/lean" --version)"
          grep -E 'version 4\.34\.0([ ,]|$)' <<< "$version"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Check the Bend model proofs
        shell: bash
        run: |
          bend PROOF.bend --verdict | tee "$RUNNER_TEMP/bend-proof.log"
          grep -Fq 'ALL PROOFS CHECK' "$RUNNER_TEMP/bend-proof.log"

      - name: Check formatting and vet affected packages
        if: matrix.label == 'PR 17 status fix'
        shell: bash
        run: |
          test -z "$(gofmt -l db/interfaces.go db/unwrap/entries.go network/manager.go node/reconcile_signers_test.go node/reconcile_test.go)"
          go vet -tags=bend ./db/unwrap ./network ./node ./rpc

      - name: Verify both reconciliation regressions
        if: matrix.label == 'PR 17 status fix'
        shell: bash
        run: |
          go test -race -count=1 -timeout=3m -v -tags=bend \
            -ldflags '-extldflags=-Wl,--allow-multiple-definition' \
            -run '^TestReconcile(StatusPreservesListenerUpdate|PendingAdvancesToTerminal)$' ./node

      - name: Run race-enabled Go and Bend tests
        shell: bash
        run: |
          events="$RUNNER_TEMP/orchestrator-tests.jsonl"
          exit_code=0
          go test -json -race -p 2 -count=1 -timeout=3m -tags=bend \
            -ldflags '-extldflags=-Wl,--allow-multiple-definition' ./db/unwrap ./network ./node ./rpc > "$events" || exit_code=$?
          jq -c '
            if .Action == "pass" or .Action == "fail" or .Action == "skip" then
              {result: .Action, package: .Package, test: .Test}
            elif .Action == "output" and ((.Output // "") | test("[0-9]+ Go outcomes checked by Bend")) then
              {result: "bend", package: .Package, test: .Test, comparisons: (.Output | capture("(?<count>[0-9]+) Go outcomes").count | tonumber)}
            else empty end
          ' "$events"
          printf 'GO_TEST_EXIT=%s\n' "$exit_code"
          exit "$exit_code"
